name: erp_club_player
description: ODIN ERP — Application mobile club
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  socket_io_client: ^3.0.2
  flutter_svg: ^2.0.16
  model_viewer_plus: ^1.9.3
  web: ^1.1.0
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0B0B14"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#0B0B14"
    theme_color: "#FF7A00"

flutter:
  uses-material-design: true
  assets:
    - assets/images/odin-logo.png
    - assets/images/app_icon.png
    - assets/models/viiv-gx17.glb
